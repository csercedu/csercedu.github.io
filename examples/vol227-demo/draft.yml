  highlight: 교육교부금 개편을 둘러싼 정부와 교육감들의 갈등이 전례 없는 집단 시위로 번졌다.
  summary: 권순기 경남교육감이 17일 국회 정문 앞에서 전국 시도교육감 릴레이 1인 시위의 첫 주자로 나섰다. 정부가 지난 8월 공개한 교부금 개편 산식은 내국세의 20.79%를 고정적으로 연동하던 방식을 바꾸는 것이다. 교육감협의회는 연동제는 유지하되 세수가 크게 늘면 일부를 미래대응기금으로 돌리는 상생안을 제안했다. 권 교육감은 연동이 깨지면 작은학교부터 무너진다고 주장했다.
