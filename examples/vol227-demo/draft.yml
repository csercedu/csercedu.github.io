  highlight: 시험장을 지키는 교사보다 교육청 간부에게 훨씬 많은 수당이 지급돼 공정성 문제가 제기됐다.
  summary: 학벌없는사회를 위한 시민모임은 17일 정보공개 청구로 받은 2023~2025년 전남·광주교육청의 수능 관련 수당 자료를 공개했다. 2025학년도 수능에서 전남청사는 교육감과 부교육감 등에게 각각 330만원을, 광주청사는 각각 136만8천원을 지급했다. 반면 수능 당일 시험 감독을 맡은 교사의 수당은 17만원이었다. 시민모임은 수능 지원은 교육청의 기본 업무라며 지급 관행을 고칠 것을 요구했다.
  why: 1번 기사(감독 교사 부담)와 함께 읽을 수 있는 교사 처우 문제
