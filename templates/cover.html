<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<style>
{{ css | safe }}
.date { font-family: "NotoKR"; font-weight: 800; font-size: 30px; letter-spacing: 1px; }
.title { font-family: "BlackHan"; font-size: 150px; letter-spacing: 6px; text-align: center; line-height: 1; padding: 26px 0 20px; white-space: nowrap; word-spacing: 18px; }
.meta { display: flex; gap: 22px; align-items: flex-start; padding: 22px 0 22px; }
.vol { background: var(--orange); color: #fff; font-family: "NotoKR"; font-weight: 900; font-size: 34px; padding: 8px 20px; white-space: nowrap; }
.tags { font-family: "NotoKR"; font-weight: 900; font-size: 33px; line-height: 1.32; letter-spacing: -.5px; word-break: keep-all; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.cell { background: #fff; padding: 8px 8px 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.cap { display: flex; gap: 10px; align-items: center; margin-top: 9px; }
.num { background: var(--orange); color: #fff; font-family: "NotoKR"; font-weight: 900; font-size: 30px; width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
.cap p { font-family: "NotoKR"; font-weight: 800; font-size: 19px; line-height: 1.3; letter-spacing: -.6px;
  word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style></head><body>
<div class="paper">
  <div class="top">
    <div class="brand"><img src="{{ root }}/assets/img/emblem.png"><div><div class="motto">하나님의 교육이 가득한 세상</div><div class="name">기독교학교교육연구소</div></div></div>
    <div class="date">{{ date_dot }}</div>
  </div>
  <div class="rule"></div>
  <div class="title">주간 교육 뉴스</div>
  <div class="rule"></div>
  <div class="meta">
    <div class="vol">VOL.{{ vol }}</div>
    <div class="tags">{% for t in hashtags %}<span style="white-space:nowrap">#{{ t }}</span> {% endfor %}</div>
  </div>
  <div class="grid">
    {% for p in picks %}
    <div class="cell" style="grid-column: span {{ p.span }}">
      <div style="height:{{ p.thumb_h }}px">{{ p.visual_html | safe }}</div>
      <div class="cap"><div class="num">{{ loop.index }}</div><p>{{ p.cover_caption }}</p></div>
    </div>
    {% endfor %}
  </div>
</div>
</body></html>
