<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{ site.org }} {{ site.title }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1080"><meta property="og:image:height" content="1080">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.base_url }}/feed.xml">
<style>
:root { --orange:#e8603c; --ink:#161616; --paper:#f4f2ed; --navy:#1d3b6a; --muted:#6b6b6b; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; word-break:keep-all; }
a { color:inherit; }
header.site { background:#fff; border-bottom:4px solid var(--ink); }
header.site .in { max-width:960px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:12px; }
header.site img { height:42px; }
header.site .org { font-size:12px; color:var(--muted); }
header.site .name { font-weight:800; font-size:19px; color:var(--navy); text-decoration:none; }
header.site nav { margin-left:auto; font-size:14px; white-space:nowrap; }
@media (max-width:520px){ header.site .org{display:none} header.site .name{font-size:16px} header.site nav a{margin-left:10px} }
header.site nav a { text-decoration:none; margin-left:14px; color:#333; }
main { max-width:960px; margin:0 auto; padding:22px 18px 60px; }
footer { text-align:center; font-size:13px; color:var(--muted); padding:30px 18px 50px; border-top:1px solid #ddd; }
.tag { display:inline-block; font-weight:700; margin-right:6px; }
.vol { background:var(--orange); color:#fff; font-weight:800; padding:2px 10px; margin-right:8px; }
</style>
{% block head %}{% endblock %}
</head><body>
<header class="site"><div class="in">
  <img src="{{ site.base_url }}/assets/emblem.png" alt="">
  <div><div class="org">하나님의 교육이 가득한 세상</div><a class="name" href="{{ site.base_url }}/">{{ site.org }} {{ site.title }}</a></div>
  <nav><a href="{{ site.base_url }}/">전체 호</a><a href="{{ site.org_url }}">연구소 홈</a></nav>
</div></header>
<main>{% block main %}{% endblock %}</main>
<footer>{{ site.org }} · 기사의 저작권은 각 언론사에 있으며, 요약은 연구소가 작성했습니다.<br>
<a href="{{ site.base_url }}/feed.xml">RSS 구독</a></footer>
</body></html>
