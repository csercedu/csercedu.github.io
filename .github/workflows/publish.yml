name: 3. 발행

# 요청 글(이슈)에 '발행' 이라고 댓글을 달면 발행한다. (저장소 주인·멤버·협업자만)
# 검토자가 draft.yml 을 고쳐 저장하면(push) 미리보기를 다시 만들고, status 가 confirmed 이면 발행한다.
# 금요일 오전에는 확정 여부를 확인해 자동 발행하거나(확인 필수 기간이 끝난 뒤) 확정을 재촉한다.
on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ["issues/**/draft.yml"]
  schedule:
    - cron: "7 1 * * 5"   # 매주 금요일 오전 10시 7분 (한국 시간)
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 할까요?"
        type: choice
        options: ["미리보기만 다시 만들기", "지금 발행"]
        default: "미리보기만 다시 만들기"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: cserc-news
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'issue_comment' ||
      (startsWith(github.event.issue.title, '카드뉴스 만들기') &&
       startsWith(github.event.comment.body, '발행') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 카드용 그림 문자 글꼴 설치
        run: sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-cjk >/dev/null

      - name: 발행 준비 (카드 → 페이지 → 문안)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRIGGER: ${{ github.event_name == 'issue_comment' && 'comment' || github.event_name == 'push' && 'push' || github.event_name == 'schedule' && 'schedule' || (inputs.mode == '지금 발행' && 'manual' || 'push') }}
        run: python scripts/pipeline.py publish --trigger "$TRIGGER"

      - name: 결과 저장
        run: |
          git config user.name "cserc-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues config
          git commit -m "주간교육뉴스 발행·미리보기 갱신" || echo "바뀐 내용 없음"
          # 실행 중에 저장소가 바뀌었으면(설정 수정 등) 최신으로 맞춘 뒤 올린다
          ok=0; for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && { ok=1; break; }
            sleep 5
          done
          [ "$ok" = 1 ]

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 보내기 (구독자 메일·카톡·수동 채널 자료)
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EDITOR_EMAILS: ${{ secrets.EDITOR_EMAILS }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          python scripts/pipeline.py notify-published
