name: 1. 매일 기사 수집 · 기사 고르기 화면

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6시 17분 (한국 시간)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cserc-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 지난 수집 자료 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pool
            data/bodies
            output
          key: newsdata-${{ github.run_id }}
          restore-keys: newsdata-

      - name: 기사 수집 + 기사 고르기 화면 만들기
        run: python scripts/pipeline.py collect

      - name: 수집 자료 보관
        uses: actions/cache/save@v4
        with:
          path: |
            data/pool
            data/bodies
            output
          key: newsdata-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
